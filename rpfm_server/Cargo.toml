[package]
name = "rpfm_server"
description = "Backend server for RPFM, exposing pack and schema operations over WebSocket and MCP."

version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]

# Memory allocator.
mimalloc = { version = "^0" }

# Network comms.
axum = { version = "^0.8", features = ["ws"] }
tokio.workspace = true
futures.workspace = true

# Logging and tracing.
tracing = "^0.1"
tracing-subscriber = "^0.3"

# Error management.
anyhow.workspace = true

# Internal dependencies.
rpfm_lib = { workspace = true, features = ["integration_git", "integration_github", "integration_assembly_kit", "support_error_bitcode"] }
rpfm_extensions.workspace = true
rpfm_ipc.workspace = true
rpfm_telemetry.workspace = true

# Multithreaded iterator support.
rayon.workspace = true
itertools.workspace = true

# Support for opening files.
open.workspace = true

# Self update support.
self_update.workspace = true
tempfile.workspace = true
reqwest.workspace = true
zip.workspace = true

# Secure storage of the GitHub token in the OS keyring.
keyring.workspace = true

# Serialization support.
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_derive.workspace = true
ron.workspace = true
uuid.workspace = true

# MCP support.
rmcp.workspace = true
schemars.workspace = true

# Windows resources support.
[target.'cfg(windows)'.build-dependencies]
winres.workspace = true
